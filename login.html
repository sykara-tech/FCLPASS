<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FCL System — Acesso</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #1e293b;
            --accent: #4f46e5;
            --accent-light: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 10px 20px -5px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.025);
            --sykara-green: #39e07a;
            --sykara-dark: #0b1220;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== Login layout ===== */
        .login-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 32px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px 28px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .login-logo {
            height: 64px;
            width: auto;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .login-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 24px;
        }

        .mode-switch {
            display: flex;
            background: var(--bg-main);
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 22px;
            border: 1px solid var(--border);
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            padding: 11px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: var(--bg-card);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .input-control {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            background: var(--bg-card);
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s;
        }
        .input-control:focus { border-color: var(--accent-light); }

        .btn-login {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-login:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,70,229,0.35); }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ===== Toast ===== */
        #toast-container {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 340px; width: calc(100% - 32px);
        }
        .toast {
            background: var(--primary); color: #fff; padding: 12px 18px; border-radius: 12px;
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18); animation: slideDown 0.3s ease;
        }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        .toast.warning { background: var(--warning); color: #111; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== SyKaraTech Footer (match reference image) ===== */
        .sykara-footer {
            width: 100%;
            background: var(--sykara-dark);
            padding: 22px 20px 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            border-top: 1px solid rgba(57, 224, 122, 0.15);
        }
        .sykara-footer-inner {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 28px;
        }
        .sykara-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
        }
        .sykara-logo-img {
            height: 72px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
        }
        .sykara-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .sykara-dev {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
        }
        .sykara-dev strong {
            color: #fff;
            font-weight: 700;
        }
        .sykara-site-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px 10px 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(57, 224, 122, 0.55);
            border-radius: 999px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s ease;
            box-shadow: 0 0 0 0 rgba(57, 224, 122, 0);
        }
        .sykara-site-btn:hover {
            border-color: var(--sykara-green);
            background: rgba(57, 224, 122, 0.08);
            box-shadow: 0 0 20px rgba(57, 224, 122, 0.15);
            transform: translateY(-1px);
        }
        .sykara-site-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--sykara-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #062012;
            font-size: 16px;
            flex-shrink: 0;
        }
        .sykara-site-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            text-align: left;
        }
        .sykara-site-text small {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255,255,255,0.55);
        }
        .sykara-site-text b {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
        }
        .sykara-arrow {
            color: var(--sykara-green);
            font-size: 13px;
            margin-left: 4px;
            opacity: 0.9;
        }

        @media (max-width: 420px) {
            .sykara-right { align-items: center; }
            .sykara-dev { text-align: center; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="login-wrap">
        <div class="login-card">
            <img class="login-logo" src="https://i.postimg.cc/m2Tj2gYD/IMG-1255-removebg-preview.png" alt="FCL">
            <div class="login-title">Terminal Blindado</div>

            <div class="mode-switch">
                <button type="button" class="mode-btn active" id="btn-mode-caixa" onclick="setLoginMode('caixa')">Operação Balcão</button>
                <button type="button" class="mode-btn" id="btn-mode-admin" onclick="setLoginMode('admin')">Controladoria</button>
            </div>

            <div id="form-caixa">
                <div class="form-group">
                    <label>Escolha o Evento Ativo</label>
                    <select class="input-control" id="login-evento-id">
                        <option value="">Carregando eventos...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Token / Senha de Entrada</label>
                    <input type="password" id="login-senha" class="input-control" placeholder="••••" autocomplete="current-password">
                </div>
            </div>

            <div id="form-admin" style="display:none;">
                <div class="form-group">
                    <label>Usuário Master</label>
                    <input type="text" id="admin-user" class="input-control" value="root" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Chave de Segurança</label>
                    <input type="password" id="admin-pass" class="input-control" value="fcl123" autocomplete="current-password">
                </div>
            </div>

            <button type="button" class="btn-login" id="btn-auth" onclick="realizarLogin()">
                <i class="fas fa-lock-open"></i> Autenticar no Terminal
            </button>
        </div>
    </div>

    <!-- Rodapé SyKaraTech (layout igual à referência) -->
    <footer class="sykara-footer">
        <div class="sykara-footer-inner">
            <a class="sykara-brand" href="https://sykara-tech.github.io/home/" target="_blank" rel="noopener noreferrer" aria-label="SyKaraTech">
                <img class="sykara-logo-img" src="logo-sykara.png" alt="SyKaraTech™">
            </a>

            <div class="sykara-right">
                <span class="sykara-dev">Desenvolvido por <strong>SyKaraTech™</strong></span>
                <a class="sykara-site-btn" href="https://sykara-tech.github.io/home/" target="_blank" rel="noopener noreferrer">
                    <span class="sykara-site-icon"><i class="fas fa-globe"></i></span>
                    <span class="sykara-site-text">
                        <small>Acesse nosso site</small>
                        <b>SyKaraTech™</b>
                    </span>
                    <i class="fas fa-arrow-up-right-from-square sykara-arrow"></i>
                </a>
            </div>
        </div>
    </footer>

    <script>
        const FIREBASE_URL = "https://sistema-fcl-default-rtdb.firebaseio.com/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let eventos = [];
        let authMode = "caixa";

        // Já logado? Vai para o app
        if (localStorage.getItem('fcl_session_evento')) {
            window.location.replace('index.html');
        }

        function showToast(msg, type = 'info') {
            const box = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + (type || '');
            el.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${msg}`;
            box.appendChild(el);
            setTimeout(() => el.remove(), 3200);
        }

        function setLoginMode(m) {
            authMode = m;
            document.getElementById('form-caixa').style.display = m === 'caixa' ? 'block' : 'none';
            document.getElementById('form-admin').style.display = m === 'admin' ? 'block' : 'none';
            document.getElementById('btn-mode-caixa').classList.toggle('active', m === 'caixa');
            document.getElementById('btn-mode-admin').classList.toggle('active', m === 'admin');
        }

        function carregarEventos() {
            const sl = document.getElementById('login-evento-id');
            db.ref('eventos').once('value').then(snap => {
                eventos = snap.val() ? Object.values(snap.val()) : [];
                if (!eventos.length) {
                    sl.innerHTML = '<option value="">Nenhum evento cadastrado</option>';
                    return;
                }
                sl.innerHTML = eventos.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
            }).catch(() => {
                sl.innerHTML = '<option value="">Erro ao carregar</option>';
                showToast('Falha ao conectar na nuvem.', 'error');
            });
        }

        function realizarLogin() {
            const btn = document.getElementById('btn-auth');
            btn.disabled = true;

            if (authMode === 'caixa') {
                const id = document.getElementById('login-evento-id').value;
                const senha = document.getElementById('login-senha').value;
                const evento = eventos.find(e => String(e.id) === String(id) && String(e.senha) === String(senha));
                if (!evento) {
                    showToast('Senha ou Evento inválido.', 'error');
                    btn.disabled = false;
                    return;
                }
                localStorage.setItem('fcl_session_evento', JSON.stringify(evento));
                localStorage.removeItem('fcl_admin_enabled');
                showToast('Acesso liberado.', 'success');
                setTimeout(() => window.location.href = 'index.html', 400);
            } else {
                const user = document.getElementById('admin-user').value.trim();
                const pass = document.getElementById('admin-pass').value;
                if (user === 'root' && pass === 'fcl123') {
                    // Admin precisa de um evento “placeholder” se não houver sessão
                    const first = eventos[0] || { id: 'admin', nome: 'Controladoria' };
                    localStorage.setItem('fcl_session_evento', JSON.stringify(first));
                    localStorage.setItem('fcl_admin_enabled', 'true');
                    showToast('Controladoria autenticada.', 'success');
                    setTimeout(() => window.location.href = 'index.html', 400);
                } else {
                    showToast('Credenciais de controladoria inválidas.', 'error');
                    btn.disabled = false;
                }
            }
        }

        // Enter para autenticar
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') realizarLogin();
        });

        carregarEventos();
    </script>
</body>
</html>
